name: CI

on:
  push:
    branches: [master, "macrocosme/**"]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # Run Qt/VisPy without a physical display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        # PySide6/Qt6 needs these shared libs even for the offscreen platform;
        # GitHub's ubuntu runners do not ship them.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 libopengl0
      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
